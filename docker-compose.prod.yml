services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logindb}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in the deployment environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  login-system:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-logindb}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the deployment environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in the deployment environment}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
