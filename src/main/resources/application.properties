# --- Database (H2, file-based so data survives restarts) ---
spring.datasource.url=jdbc:h2:file:./data/logindb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console is disabled outside local database tooling
spring.h2.console.enabled=false

# --- JWT ---
# IMPORTANT: replace this with a long, random secret (32+ bytes) via an
# environment variable in production, e.g. export APP_JWT_SECRET=... and
# reference it here as ${APP_JWT_SECRET}. Never commit real secrets.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=3600000

server.port=${SERVER_PORT:8081}
